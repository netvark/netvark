name: Feature request
description: Propose an addition or change to the API.
labels: [enhancement]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        [
          '@netvark/ban-core',
          '@netvark/hono-ban',
          '@netvark/catalog-core',
          '@netvark/pg-catalog',
          '@netvark/jsonapi-core',
          '@netvark/hono-jsonapi',
          '@netvark/keyset-core',
          '@netvark/kysely-keyset',
          '@netvark/resource-core',
          a new package,
          the repository or its docs,
        ]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today, and what does the workaround look like?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Show the code you would like to write.
      render: ts
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

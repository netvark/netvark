name: Bug report
description: Something behaves differently from the documentation.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package and version
      placeholder: '@netvark/keyset-core 0.1.0, or @netvark/hono-ban 2.0.0'
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and version
      placeholder: Node 24.11, Bun 1.3, Cloudflare Workers (compat date), Deno 2.x
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host library and version
      description: When the report concerns a binding, the version of Hono or Kysely, and of PostgreSQL for the keyset packages.
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A short script or a link to a repository. Include the definition (catalog, resource, or keyset), the request (method, URL, headers, body, or sort, filter, page), and for the keyset packages the compiled SQL from `onQuery` when you have it.
      render: ts
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full response body and headers, the page returned, the SQL, or the error output.
    validations:
      required: true

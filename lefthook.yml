# Git hooks. Installed by `pnpm install` through the `prepare` script.
# @ref https://lefthook.dev/configuration/
pre-commit:
  parallel: true
  jobs:
    # oxfmt exits non-zero when every path it gets is ignored (CHANGELOG.md,
    # pnpm-lock.yaml); a commit of only those files is still a valid commit.
    # @ref https://oxc.rs/docs/guide/usage/formatter/cli.html#runtime-options
    - name: format
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
      glob: '*.{ts,js,json,jsonc,md,yml,yaml}'
    - name: lint
      run: pnpm exec oxlint {staged_files}
      glob: '*.{ts,js}'

pre-push:
  jobs:
    - name: types
      run: pnpm run check:types
    - name: test
      run: pnpm test
